<!doctype html>
<!-- СГЕНЕРИРОВАННЫЙ ФАЙЛ. Источники: client/template.html и src/**. Собирается командой `npm run build-client`, руками не править. -->
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Переводной дурак</title>
<style>
  :root{
    --felt-1:#1e4638;
    --felt-2:#123028;
    --rail:#4a2e18;
    --rail-hi:#8b5a2b;
    --cream:#f5f0e1;
    --ink:#211d16;
    --brick:#a63a2e;
    --gold:#c9a227;
    --paper-dim:#cfc6ad;
    --bg-a:#2a2018; --bg-b:#14100c; --bg-c:#0b0908;
    --panel-border:#4a3a26; --panel-bg:#1b140d; --input-bg:#241b12;
    --slot-border:#6b5638; --log-border:#3a2c1c; --footer-muted:#6b6153;
    --log-hl-bg:#3a2c1c; --log-hl-text:var(--cream);
    --text-strong:var(--cream);
    --display: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --card-w: clamp(44px, 7vw, 62px);
    --card-h: clamp(62px, 9.8vw, 87px);
    /* --hand-scale — множитель размера карт ИГРОКА ВНИЗУ (только своей руки),
       регулируется ползунком в шапке стола (#handSizeRange) и сохраняется
       в localStorage, чтобы подбирать удобный размер прямо во время игры,
       не меняя десктопный интерфейс и не ломая сетку стола. */
    --hand-scale: 1;
    --hand-card-w: calc(var(--card-w) * var(--hand-scale));
    --hand-card-h: calc(var(--card-h) * var(--hand-scale));
  }
  @media (min-width:681px){
    :root{
      --hand-card-w: calc(clamp(44px, 7vw, 62px) * var(--hand-scale));
      --hand-card-h: calc(clamp(62px, 9.8vw, 87px) * var(--hand-scale));
    }
  }
  @media (max-width:680px){
    :root{
      --hand-card-w: calc(clamp(120px, 30vw, 160px) * var(--hand-scale));
      --hand-card-h: calc(clamp(170px, 42.5vw, 226px) * var(--hand-scale));
    }
  }
  body{
    margin:0; background:var(--bg-a); color:var(--cream);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding:20px;
  }
  .wrap{ max-width:820px; margin:0 auto; }
  header{ margin-bottom:18px; border-bottom:1px solid var(--panel-border); padding-bottom:12px; }
  h1{ font-family:var(--display); font-size:26px; margin:0 0 4px; color:var(--text-strong); letter-spacing:.3px; }
  .eyebrow{ font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--footer-muted); }
  
  fieldset{
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:10px;
    padding:12px 16px; margin:0 0 14px;
  }
  legend{ font-family:var(--display); font-weight:700; color:var(--gold); padding:0 6px; }
  label{ display:block; margin:8px 0; font-size:13px; }
  select, input, button{
    background:var(--input-bg); color:var(--cream); border:1px solid var(--panel-border);
    border-radius:6px; padding:6px 10px; font-size:13px; font-family:inherit;
  }
  button{
    background:linear-gradient(to bottom, #3b2a1a, #241a10);
    border-color:var(--gold); color:var(--gold); font-weight:700; cursor:pointer;
  }
  button:hover{ background:linear-gradient(to bottom, #4c3722, #302215); }

  .game-screen{ display:none; }
  .game-screen.active{ display:block; }
  
  .game-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:10px;
    padding:8px 12px; margin-bottom:12px; gap:8px;
  }
  .table{
    background:radial-gradient(ellipse at center, var(--felt-1) 0%, var(--felt-2) 100%);
    border:8px solid var(--rail); border-radius:20px; padding:16px 12px 14px;
    box-shadow:0 12px 30px #000a, inset 0 0 40px #0006;
    position:relative; margin-bottom:14px;
  }
  .opponents-row{ display:flex; justify-content:space-around; gap:8px; margin-bottom:14px; }
  .opp{
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:8px;
    padding:6px 10px; text-align:center; min-width:80px; position:relative;
  }
  .opp-name{ font-weight:700; font-size:12px; margin-bottom:2px; }
  .hand-count{ font-family:var(--mono); font-size:11px; opacity:.85; }

  .mid-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; position:relative; min-height:calc(var(--card-h) + 20px); }
  .talon-area{ display:flex; align-items:center; gap:8px; }
  .talon-card{
    width:var(--card-w); height:var(--card-h); border-radius:6px; background:var(--cream);
    box-shadow:0 4px 10px #0007; position:relative; background:repeating-linear-gradient(45deg, #1e3f32, #1e3f32 10px, #163026 10px, #163026 20px);
    border:2px solid var(--slot-border);
  }
  .talon-count, .discard-count{ font-family:var(--mono); font-size:11px; }

  .trick-area{
    display:flex; gap:clamp(8px,2vw,14px); flex-wrap:wrap; justify-content:center;
    min-width:0; flex:1 1 auto;
  }
  .trick-pair{ position:relative; width:var(--card-w); height:calc(var(--card-h) + 20px); }
  .trick-pair .attack-card{ position:absolute; top:0; left:0; }
  .trick-pair .defense-card{ position:absolute; top:14px; left:calc(var(--card-w) * 0.3); }
  .trick-area.taking-cards .trick-pair{ opacity:.55; filter:grayscale(35%); transition:opacity .15s,filter .15s; }
  .taking-label{ font-family:var(--mono); font-size:11px; opacity:.75; width:100%; text-align:center; margin-bottom:4px; }

  .discard-area{ text-align:center; }
  .discard-pile{
    width:var(--card-w); height:var(--card-h); border-radius:8px; border:2px dashed var(--slot-border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:12px; color:var(--slot-border); margin:0 auto 6px;
  }

  .card{
    width:var(--card-w); height:var(--card-h); border-radius:6px; background:var(--cream);
    box-shadow:0 4px 10px #0007, inset 0 0 0 1px #0002;
    position:relative; font-family:var(--display); font-weight:700;
    line-height:.92; flex:none;
  }
  .card.ink{color:var(--ink);}
  .card.brick{color:var(--brick);}
  .corner{ position:absolute; top:4px; left:4px; font-size:11px; display:flex; flex-direction:column; align-items:center; }
  .corner.br{ top:auto; bottom:4px; right:4px; left:auto; transform:rotate(180deg); }
  .corner .s{ font-size:10px; margin-top:1px; }

  .my-hand-wrap{ margin-top:10px; }
  .my-hand{
    display:flex; overflow-x:auto; padding:8px 4px; gap:4px; min-height:calc(var(--hand-card-h) + 16px);
    align-items:center;
  }
  .my-hand .card{
    width:var(--hand-card-w); height:var(--hand-card-h);
    cursor:pointer; transition:transform .12s, box-shadow .12s;
  }
  .my-hand .card:hover{ transform:translateY(-6px); }

  .action-bar{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .action-bar button{ flex:1; padding:10px; font-size:14px; }

  .status-line{
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:8px;
    padding:8px 12px; margin-bottom:12px; font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .hud-chip{ background:var(--input-bg); border:1px solid var(--panel-border); border-radius:6px; padding:3px 8px; font-size:12px; }
  
  .log{
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:8px;
    padding:8px; font-family:var(--mono); font-size:12px; max-height:150px; overflow-y:auto;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="setupScreen" class="game-screen active">
    <h1>Переводной дурак</h1>
    <div class="eyebrow">Настройка партии</div>
    <fieldset>
      <legend>Параметры</legend>
      <label>Игроков: <select id="numPlayers"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select></label>
      <label>Колода: <select id="deckSize"><option value="24">24 карты</option><option value="36" selected>36 карт</option><option value="52">52 карты</option></select></label>
      <label>Раскладка на мобильном: <select id="tableLayoutMobile"><option value="scroll" selected>Скролл вбок</option><option value="wrap">Перенос вниз</option></select></label>
      <button id="newGameBtn" style="margin-top:12px; width:100%; padding:10px;">Начать игру</button>
    </fieldset>
  </div>
  
  <div id="gameScreen" class="game-screen">
    <div class="game-topbar">
      <button id="backToSetupBtn">Настройки</button>
      <div id="turnHint" class="turn-hint">Ход игры</div>
    </div>
    <div id="statusLine" class="status-line"></div>
    <div class="table layout-scroll" id="tableBoard">
      <div id="opponentsRow" class="opponents-row"></div>
      <div class="mid-row">
        <div class="talon-area">
          <div id="talonCard" class="talon-card"></div>
          <div><div id="talonCount" class="talon-count"></div><div id="trumpSuitView"></div></div>
        </div>
        <div id="trickArea" class="trick-area"></div>
        <div class="discard-area">
          <div id="discardPile" class="discard-pile">бито</div>
          <div id="discardCount" class="discard-count"></div>
        </div>
      </div>
    </div>
    <div class="my-hand-wrap">
      <div id="myHand" class="my-hand"></div>
      <div id="actionBar" class="action-bar"></div>
    </div>
    <div id="gameLog" class="log"></div>
  </div>
</div>
<script>
// Минимальный рабочий интерфейс
const DEFAULT_RULES = { handSize: 6 };
let mode = 'interactive';
document.getElementById('newGameBtn').addEventListener('click', ()=>{
  document.getElementById('setupScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
});
document.getElementById('backToSetupBtn').addEventListener('click', ()=>{
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('setupScreen').classList.add('active');
});
</script>
</body>
</html>
