<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Переводной дурак</title>
<style>
  :root{
    --felt-1:#1e4638;
    --felt-2:#123028;
    --rail:#4a2e18;
    --rail-hi:#8b5a2b;
    --cream:#f5f0e1;
    --ink:#211d16;
    --brick:#a63a2e;
    --gold:#c9a227;
    --paper-dim:#cfc6ad;
    --bg-a:#2a2018; --bg-b:#14100c; --bg-c:#0b0908;
    --panel-border:#4a3a26; --panel-bg:#1b140d; --input-bg:#241b12;
    --slot-border:#6b5638; --log-border:#3a2c1c; --footer-muted:#6b6153;
    --log-hl-bg:#3a2c1c; --log-hl-text:var(--cream);
    --text-strong:var(--cream);
    --display: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --card-w: clamp(44px, 7vw, 62px);
    --card-h: clamp(62px, 9.8vw, 87px);
    --hand-card-w: clamp(60px, 8.6vw, 88px);
    --hand-card-h: clamp(84px, 12vw, 124px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]):not([data-theme="light"]){
      --felt-1:#ece2c8; --felt-2:#ddcfa6; --rail:#8a6a42; --rail-hi:#c39a5c;
      --gold:#8a6a1a; --paper-dim:#5c5344;
      --bg-a:#faf6ec; --bg-b:#f0ead9; --bg-c:#e6dfc9;
      --panel-border:#cfc2a0; --panel-bg:#f6f1e3; --input-bg:#efe8d5;
      --slot-border:#a9926a; --log-border:#d9cca3; --footer-muted:#8a7f68;
      --log-hl-bg:#e6d9b0; --log-hl-text:var(--ink);
      --text-strong:var(--ink);
    }
  }
  :root[data-theme="light"]{
    --felt-1:#ece2c8; --felt-2:#ddcfa6; --rail:#8a6a42; --rail-hi:#c39a5c;
    --gold:#8a6a1a; --paper-dim:#5c5344;
    --bg-a:#faf6ec; --bg-b:#f0ead9; --bg-c:#e6dfc9;
    --panel-border:#cfc2a0; --panel-bg:#f6f1e3; --input-bg:#efe8d5;
    --slot-border:#a9926a; --log-border:#d9cca3; --footer-muted:#8a7f68;
    --log-hl-bg:#e6d9b0; --log-hl-text:var(--ink);
    --text-strong:var(--ink);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: radial-gradient(120% 100% at 50% 0%, var(--bg-a) 0%, var(--bg-b) 60%, var(--bg-c) 100%);
    color:var(--paper-dim);
    font-family:var(--display);
    min-height:100vh;
    padding:20px 14px 40px;
    transition:background-color .2s, color .2s;
  }
  .wrap{max-width:980px;margin:0 auto;}
  header{margin-bottom:16px;}
  .eyebrow{
    font-family:var(--mono); letter-spacing:.18em; font-size:11px;
    color:var(--gold); text-transform:uppercase; margin-bottom:4px;
  }
  h1{margin:0 0 12px; font-size:28px; font-weight:600; color:var(--text-strong); letter-spacing:.01em;}
  .controls-bar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    font-family:var(--mono); font-size:12px;
  }
  .settings-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    flex:1 1 100%; width:100%;
  }
  .settings-panel{
    margin-top:12px; border:1px solid var(--panel-border); border-radius:8px;
    background:var(--panel-bg); padding:2px 12px 10px;
  }
  .settings-panel summary{
    cursor:pointer; font-family:var(--mono); font-size:12px; color:var(--gold);
    text-transform:uppercase; letter-spacing:.05em; padding:9px 0;
    list-style:none;
  }
  .settings-panel summary::-webkit-details-marker{ display:none; }
  .settings-panel summary::before{ content:"▸ "; display:inline-block; transition:transform .15s; }
  .settings-panel[open] summary::before{ transform:rotate(90deg); }
  .settings-panel .controls-bar{ margin-top:2px; }
  select, button{
    font-family:var(--mono); font-size:12px; background:var(--input-bg); color:var(--paper-dim);
    border:1px solid var(--panel-border); border-radius:4px; padding:6px 10px; cursor:pointer;
  }
  button:hover, select:hover{border-color:var(--gold); color:var(--text-strong);}
  button.primary{background:var(--brick); color:var(--cream); border-color:var(--brick);}
  button.primary:hover{filter:brightness(1.1);}
  button:disabled{opacity:.35; cursor:default;}

  .table{
    margin-top:18px;
    background:
      radial-gradient(140% 90% at 50% 8%, var(--felt-1) 0%, var(--felt-2) 72%);
    border:10px solid var(--rail);
    border-image: linear-gradient(160deg, var(--rail-hi), var(--rail)) 1;
    border-radius:38px;
    box-shadow: 0 30px 60px -20px #000a, inset 0 0 60px #0006;
    padding:26px 22px 20px;
    position:relative;
  }
  @media (max-width:680px){
    .table{ border-radius:16px; padding:10px 6px 8px; }
    .mid-row{ gap:12px; margin-bottom:12px; min-height:100px; }
    .trick-area{ gap:6px; }
    .trick-pair{ width:calc(var(--card-w) * 0.85); height:calc(var(--card-h) + 12px); }
    .trick-pair .defense-card{ top:10px; left:calc(var(--card-w) * 0.25); }
    :root {
      --card-w: clamp(34px, 12vw, 48px);
      --card-h: clamp(48px, 16vw, 68px);
    }
  }

  .status-line{
    font-family:var(--mono); font-size:12px; color:var(--gold);
    text-align:center; margin-bottom:14px; min-height:16px;
  }

  /*
    Места за столом. Контейнер — дуга над центром стола; каждый .opp
    позиционируется абсолютно, координаты заданы для 1..5 соперников
    (2..6 игроков всего), чтобы при любом их числе рассадка выглядела
    как места вокруг овального стола, а не как ряд в очереди.
  */
  .opponents{
    position:relative;
    height:clamp(190px, 27vw, 250px);
    margin-bottom:20px;
  }
  .opponents[data-count="4"], .opponents[data-count="5"]{
    height:clamp(230px, 32vw, 300px);
  }
  .opp{
    text-align:center; position:absolute;
    left:50%; top:0; transform:translateX(-50%);
    width:max-content; max-width:132px;
  }
  .opponents[data-count="1"] .opp:nth-child(1){ left:50%; top:0%; }

  .opponents[data-count="2"] .opp:nth-child(1){ left:22%; top:18%; }
  .opponents[data-count="2"] .opp:nth-child(2){ left:78%; top:18%; }

  .opponents[data-count="3"] .opp:nth-child(1){ left:12%; top:22%; }
  .opponents[data-count="3"] .opp:nth-child(2){ left:50%; top:0%; }
  .opponents[data-count="3"] .opp:nth-child(3){ left:88%; top:22%; }

  .opponents[data-count="4"] .opp:nth-child(1){ left:7%;  top:14%; }
  .opponents[data-count="4"] .opp:nth-child(2){ left:32%; top:6%; }
  .opponents[data-count="4"] .opp:nth-child(3){ left:68%; top:6%; }
  .opponents[data-count="4"] .opp:nth-child(4){ left:93%; top:14%; }

  .opponents[data-count="5"] .opp:nth-child(1){ left:4%;  top:16%; }
  .opponents[data-count="5"] .opp:nth-child(2){ left:23%; top:14%; }
  .opponents[data-count="5"] .opp:nth-child(3){ left:50%; top:0%; }
  .opponents[data-count="5"] .opp:nth-child(4){ left:77%; top:14%; }
  .opponents[data-count="5"] .opp:nth-child(5){ left:96%; top:16%; }

  .opp .label{
    font-family:var(--mono); font-size:11px; color:var(--paper-dim);
    margin-bottom:6px; display:flex; align-items:center; gap:6px; justify-content:center;
    flex-wrap:wrap;
  }
  .role-tag{
    font-size:9px; padding:1px 6px; border-radius:8px; letter-spacing:.05em;
    text-transform:uppercase; font-family:var(--mono);
  }
  .role-tag.attacker{background:var(--brick); color:var(--cream);}
  .role-tag.defender{background:var(--gold); color:#2a2010;}
  .fan{display:flex; justify-content:center;}
  .fan .card-back{
    width:clamp(30px, 5vw, 44px); height:clamp(44px, 7.3vw, 64px);
    margin-left:clamp(-24px, -3.4vw, -14px);
  }
  .fan .card-back:first-child{ margin-left:0; }
  /* Боковые места при 5+ игроках: карты веером вниз, а не вбок — экономит горизонтальное место. */
  .opp.vertical{ max-width:calc(clamp(30px, 5vw, 44px) + 26px); }
  .opp.vertical .fan{
    flex-direction:column; align-items:center;
  }
  .opp.vertical .fan .card-back{
    margin-left:0; margin-top:clamp(-46px, -6.4vw, -26px);
  }
  .opp.vertical .fan .card-back:first-child{ margin-top:0; }
  .opp.out .fan, .opp.out .label{opacity:.3;}
  .finish-badge{
    font-family:var(--mono); font-size:10px; color:var(--gold); margin-top:4px;
  }

  .mid-row{
    display:flex; align-items:flex-start; justify-content:center; gap:28px;
    min-height:130px; margin-bottom:22px; flex-wrap:wrap;
  }

  .talon-area{ text-align:center; }
  .talon-stack{ position:relative; width:var(--card-w); height:var(--card-h); margin:0 auto 6px; }
  .talon-stack .card-back{ position:absolute; top:0; left:0; }
  .trump-peek{
    position:absolute; left:calc(var(--card-w) * 0.48); top:14px; transform:rotate(90deg);
    transform-origin:left top;
  }
  .talon-count, .discard-count{ font-family:var(--mono); font-size:11px; }

  .trick-area{
    display:flex; gap:clamp(8px,2vw,14px); flex-wrap:wrap; justify-content:center;
    min-width:0; flex:1 1 auto;
  }
  .trick-pair{ position:relative; width:var(--card-w); height:calc(var(--card-h) + 20px); }
  .trick-pair .attack-card{ position:absolute; top:0; left:0; }
  .trick-pair .defense-card{ position:absolute; top:14px; left:calc(var(--card-w) * 0.3); }
  .trick-area.taking-cards .trick-pair{ opacity:.55; filter:grayscale(35%); transition:opacity .15s,filter .15s; }
  .taking-label{ font-family:var(--mono); font-size:11px; opacity:.75; width:100%; text-align:center; margin-bottom:4px; }

  .discard-area{ text-align:center; }
  .discard-pile{
    width:var(--card-w); height:var(--card-h); border-radius:8px; border:2px dashed var(--slot-border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:12px; color:var(--slot-border); margin:0 auto 6px;
  }

  .card{
    width:var(--card-w); height:var(--card-h); border-radius:6px; background:var(--cream);
    box-shadow:0 4px 10px #0007, inset 0 0 0 1px #0002;
    position:relative; font-family:var(--display); font-weight:700;
    line-height:.92; flex:none;
  }
  .card.ink{color:var(--ink);}
  .card.brick{color:var(--brick);}
  /* Индекс (ранг+масть) вынесен в угол — вариант "1d": ранг ~40% ширины карты,
     масть ~32%, без фонового символа по центру. Продублирован вверх ногами в
     противоположном углу, поэтому при любом нахлёсте карт в веере видно,
     что это за карта. */
  .card .corner{
    position:absolute; top:calc(var(--card-w) * .07); left:calc(var(--card-w) * .08);
    text-align:center;
  }
  .card .corner.br{
    top:auto; left:auto; bottom:calc(var(--card-w) * .07); right:calc(var(--card-w) * .08);
    transform:rotate(180deg);
  }
  .card .corner .r{ font-size:calc(var(--card-w) * .4); }
  .card .corner .s{ font-size:calc(var(--card-w) * .32); margin-top:1px; }
  .card-back{
    width:var(--card-w); height:var(--card-h); border-radius:6px;
    background:
      repeating-linear-gradient(135deg, #2c4a3f 0 6px, #234037 6px 12px);
    border:1px solid #0a1a14; box-shadow:0 4px 10px #0007; flex:none;
  }

  .my-hand-wrap{ text-align:center; }
  .my-hand-label{
    font-family:var(--mono); font-size:11px; margin-bottom:8px;
    display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap;
  }
  .my-hand{
    position:relative; margin:0 auto; width:100%;
    min-height:calc(var(--hand-card-h) + 6px);
  }
  .my-hand .card{
    position:absolute; left:50%; bottom:0;
    width:var(--hand-card-w); height:var(--hand-card-h);
    transform-origin:bottom center;
    transform:translate(var(--tx,0px), var(--ty,0px)) rotate(var(--tr,0deg));
    z-index:var(--zi,1);
    transition:transform .15s;
  }
  .my-hand .card .corner{
    top:calc(var(--hand-card-w) * .05); left:calc(var(--hand-card-w) * .06);
  }
  .my-hand .card .corner.br{
    bottom:calc(var(--hand-card-w) * .05); right:calc(var(--hand-card-w) * .06);
  }
  .my-hand .card .corner .r{ font-size:calc(var(--hand-card-w) * .4); }
  .my-hand .card .corner .s{ font-size:calc(var(--hand-card-w) * .32); }
  .my-hand .card.playable{ cursor:pointer; box-shadow:0 0 0 2px var(--gold), 0 4px 10px #0007; }
  .my-hand .card.playable.transferable{ box-shadow:0 0 0 2px #5b9bd5, 0 4px 10px #0007; }
  .my-hand .card.unplayable{ opacity:.55; }
  @media (hover:hover) and (pointer:fine){
    .my-hand .card:hover{
      transform:translate(var(--tx,0px), calc(var(--ty,0px) - 10px)) rotate(var(--tr,0deg));
      z-index:50;
    }
    .my-hand .card.playable:hover{
      transform:translate(var(--tx,0px), calc(var(--ty,0px) - 14px)) rotate(var(--tr,0deg));
      z-index:50;
    }
  }
  .my-hand .card.playable:active{
    transform:translate(var(--tx,0px), calc(var(--ty,0px) - 10px)) rotate(var(--tr,0deg));
    z-index:50;
  }

  .action-bar{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px; min-height:30px;
